name: Build Folia 1.21.4 JAR

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17 (for core and proxy submodules)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up JDK 21 (for Folia 1.21.4)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Folia 1.21.4 JAR
        run: ./gradlew :folia:build --no-daemon

      - name: Upload Folia JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: advanced-portals-folia-1.21.4
          path: folia/build/libs/advanced-portals-*-folia.jar
          if-no-files-found: error
